<body>

<div id="notice">This page is configured to auto-start mining. Only open this file on machines you own.</div>

<h2 align="center">Cryptonight mining - Autostart (for personal rig)</h2>

    <div class="box">

        <h2>
            <span id="threads">2</span>
            <span id="thread-add" class="action"> + </span>
            <span class="divide"> / </span>
            <span id="thread-remove" class="action"> - </span>
        </h2>
    </div>
</div>

<div class="row" align="center">
    <div class="box">
        <h3> Total Hashes | Accepted Shares</h3>
        <h2 id="accepted-shares">0</h2>

    </div>
</div>

</div>

<div class="row">
    <!-- Wallet prefilled (your address inserted) -->
    <input class="text" type="text" id="wallet" value="44dVFySgZBJhRPXg8cUqJv6Azait9G4k1Sg41ihdtgpi1sy3icvhXjr8tBkH31Sv1YeL78PGmcr8V29DCaGxT5kX9EmGhTw" style="width:80%">
</div>

    <canvas id="barchart-canvas" class="stats" width="100%" height="27%"></canvas>

<button id="start">Start</button>
<button id="stop">Stop</button>

<p align="center">© 2017 - 2025 | crypto-webminer.com (local copy)</p>

<!-- Helpful guide links kept but not automatically followed -->

  <form action="https://www.crypto-webminer.com/miningguides.html" target="_blank"><input type="submit" value="You need a helping guide?"/></form>
</div>

<script>
// --- Auto-start behavior for a personal rig ---
window.addEventListener('load', function() {
    // small delay to allow miner scripts to initialize
    setTimeout(function() {
        try {
            // If there's a Start button, trigger it (most UIs listen for click)
            var startBtn = document.getElementById('start');
            if (startBtn) {
                startBtn.click();
            }
        } catch (e) {
            console.error('Auto-start failed:', e);
        }
    }, 1500);
});

// --- Basic Start/Stop handlers (best-effort, depends on included miner lib) ---
document.getElementById('start').addEventListener('click', function() {
    // Many miners require specific init calls; gustav.js from the original site
    // should handle wiring the UI to the underlying miner. Here we ensure
    // the wallet value is available (some miners read #wallet on start).
    var w = document.getElementById('wallet').value.trim();
    if (!w) {
        document.getElementById('invalid').textContent = 'Please provide a wallet address before starting.';
        return;
    }
    document.getElementById('invalid').textContent = '';

    // Best-effort: try common global objects/APIs used by browser miners
    try {
        // Example: if the miner exposes a global `mmh` object
        if (window.mmh && typeof window.mmh.start === 'function') {
            window.mmh.setWallet && window.mmh.setWallet(w);
            window.mmh.start();
            console.log('mmh.start() called');
            return;
        }
        // If gustav.js binds UI clicks to start the miner, triggering the button
        // may be sufficient (we already clicked it during auto-start).
    } catch (err) {
        console.warn('Start attempt: ', err);
    }

    console.log('Start button clicked — ensure your included scripts start the miner when the button is clicked.');
});

document.getElementById('stop').addEventListener('click', function() {
    // Best-effort stop attempts. Actual stop depends on the miner implementation.
    try {
        if (window.mmh && typeof window.mmh.stop === 'function') {
            window.mmh.stop();
            console.log('mmh.stop() called');
        }
        // Try common global variables used by some miners
        if (window._miner && typeof window._miner.stop === 'function') window._miner.stop();
        if (window.miner && typeof window.miner.stop === 'function') window.miner.stop();
        // As a last resort, try to terminate web workers if references exist
        if (window.__workerInstance && typeof window.__workerInstance.terminate === 'function') window.__workerInstance.terminate();
    } catch (e) {
        console.warn('Stop attempt failed:', e);
    }
    alert('Stop attempted. If mining continues, close this tab to stop immediately.');
});

// Threads +/- UI (simple local changes; actual thread control depends on miner API)
document.getElementById('thread-add').addEventListener('click', function(){
    var el = document.getElementById('threads');
    var n = parseInt(el.textContent||'2',10);
    el.textContent = n+1;
});
document.getElementById('thread-remove').addEventListener('click', function(){
    var el = document.getElementById('threads');
    var n = parseInt(el.textContent||'2',10);
    if (n>1) el.textContent = n-1;
});

</script>
</body>
</html>
